server:
  port: 8080
  host: 127.0.0.1
  # Bearer token required for all /api/* requests. Leave empty to generate a
  # random token at each startup (printed to the console).
  token: ""

llm:
  base_url: http://127.0.0.1:11435/v1
  api_key: ollama
  model: qwen3-coder
  temperature: 0.2
  max_tokens: 4096
  # Stream chat completions (SSE): live token output via llm_delta events.
  # Disable if your server misbehaves in stream mode; the agent also falls
  # back to plain requests automatically when streaming fails to start.
  stream: true

agent:
  max_iterations: 30
  max_consecutive_repeat_tool_calls: 3

workspace:
  root: .

shell:
  default_timeout: 120
  max_timeout: 600

logging:
  level: info
  file: ""
